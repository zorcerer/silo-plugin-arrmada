# A release is a merged pull request that sets manifest.json "version", then a
# maintainer pushes the matching v<version> tag on the commit that change put
# on main. CONTRIBUTING.md#release has the steps.
#
# The release job is Silo's shared plugin release workflow. It refuses a tag
# that is not v<semver>, not on main's first-parent history, or that disagrees
# with manifest.json, and publishes plugin-<os>-<arch>, checksums.txt and
# plugin.sigstore.json (build provenance signed by that workflow). It notifies
# the community catalog only when SILO_PLUGINS_DISPATCH_TOKEN is set.
#
# The index job then attaches index.json, the Silo plugin repository index,
# so the plugin also installs from
# https://github.com/<this repository>/releases/latest/download/index.json
name: release

on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Always @main: Silo servers pin the signer to plugin-release.yml@refs/heads/main.
    uses: Silo-Server/.github/.github/workflows/plugin-release.yml@main
    with:
      catalog_repository: Silo-Community/silo-plugins
    secrets:
      dispatch_token: ${{ secrets.SILO_PLUGINS_DISPATCH_TOKEN }}

  index:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The index names the published binaries by their SHA-256, so it is
      # written from what the release holds, after checksums.txt agrees.
      - name: Index
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'plugin-*' --pattern checksums.txt
          (cd dist && sha256sum --check --strict checksums.txt)
          go run ./cmd/index -repo "$GITHUB_REPOSITORY" -version "${TAG#v}" -dist dist -bundle > index.json
          jq -e --arg v "${TAG#v}" '.plugins[0].manifest.version == $v' index.json
          gh release upload "$TAG" index.json --repo "$GITHUB_REPOSITORY"
