# Checks, tests and builds the plugin on every push and pull request, and
# keeps the three binaries as an artifact of the run. Releases are built by
# release.yml, through Silo's shared plugin release workflow.
name: build

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The shared release workflow refuses these; fail here first.
      - name: Reject local replaces
        run: |
          bad="$(go mod edit -json | jq -r '.Replace // [] | .[] | select(.Old.Path == "github.com/Silo-Server/silo-plugin-sdk" or (.New.Path | startswith("/")) or (.New.Path | startswith("../"))) | .Old.Path')"
          if [ -n "$bad" ]; then
            echo "::error file=go.mod::go.mod has replace directives a release cannot use: $bad"
            exit 1
          fi

      - name: Format and vet
        run: make vet

      # Known vulnerabilities in the dependencies, and in the standard
      # library of the Go version go.mod names, which releases are built with.
      - name: Vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Test
        run: make test e2e

      - name: Build
        run: make build-all

      # The binary carries manifest.json's version, which the release tag
      # must match.
      - name: Check the manifest
        run: |
          make build
          version="$(jq -r .version manifest.json)"
          ./plugin manifest | jq -e --arg version "$version" '.version == $version'
          ./plugin manifest | jq -e '[.capabilities[].type] | sort == ["request_router.v1", "scan_source.v1"]'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin
          path: dist/
          if-no-files-found: error
